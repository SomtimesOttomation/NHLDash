<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://nhldash.cache; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>NHL 2026-27</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="img/tab-icon.svg" alt="">
    <h1>NHL 2026-27</h1>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="scores">Scores</a>
      <a href="#/standings" data-tab="standings">Standings</a>
      <a href="#/leaders" data-tab="leaders">Leaders</a>
      <a href="#/rankings" data-tab="rankings">Rankings</a>
      <a href="#/rookies" data-tab="rookies">Rookies</a>
      <a href="#/transactions" data-tab="moves">Moves</a>
      <a href="#/advanced" data-tab="advanced">Advanced</a>
    </nav>
    <button id="btn-version" class="ver-btn" type="button" hidden title="Check for updates"></button>
    <button id="btn-theme" class="icon-btn" type="button" hidden>Theme</button>
  </header>
  <nav id="banner" class="banner" aria-label="Teams"></nav>
  <nav id="weekbar" class="weekbar" aria-label="Season weeks"></nav>

  <!-- Shared navigation bar: same order, look and keys in every dash (docs/NAVBAR-SPEC.md). -->
  <div class="navpill-row">
    <div id="navpill" class="navpill" role="navigation" aria-label="Page navigation">
      <button id="btn-back" class="np-btn" type="button" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="btn-fwd" class="np-btn" type="button" title="Forward (Alt+Right)" aria-label="Forward"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <a id="btn-home" class="np-btn" href="#/" title="Home" aria-label="Home" data-route="home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button id="btn-refresh" class="np-btn" type="button" title="Refresh (F5)" aria-label="Refresh"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="np-sep" aria-hidden="true"></span>
      <div class="psearch">
        <input id="psearch" type="search" placeholder="Search teams and players..." autocomplete="off" spellcheck="false" aria-label="Search teams and players">
        <div id="psearch-results" class="psearch-results" hidden></div>
      </div>
      <span class="np-sep" aria-hidden="true"></span>
      <button id="live-status" class="live-status np-live" type="button" aria-pressed="false"></button>
      <button id="btn-settings" class="np-btn" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7.6 7.6 0 0 1-1.7 1l-.3 2h-3.6l-.3-2a7.6 7.6 0 0 1-1.7-1l-1.9.7-1.8-3.1 1.6-1.2a7.7 7.7 0 0 1 0-2l-1.6-1.2 1.8-3.1 1.9.7a7.6 7.6 0 0 1 1.7-1l.3-2h3.6l.3 2a7.6 7.6 0 0 1 1.7 1l1.9-.7 1.8 3.1-1.6 1.2a7.7 7.7 0 0 1 0 2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <div id="halted" class="halted" hidden role="status">
    <span><strong>Data traffic stopped.</strong> Nothing is downloaded until you resume. Saved data still shows.</span>
    <button id="btn-resume" class="btn primary" type="button">Resume</button>
  </div>

  <main id="view"></main>

  <div id="dialog" class="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-box">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="actions"><button id="dialog-ok" class="btn primary" type="button">I understand, turn it on</button><button id="dialog-cancel" class="btn" type="button">Cancel</button></div>
    </div>
  </div>

  <div id="cmpbar" class="cmpbar" hidden></div>
  <div id="upd" class="dialog" hidden role="dialog" aria-modal="true" aria-label="Updates"><div class="dialog-box upd" id="upd-box"></div></div>

  <p class="foot muted small">Unofficial. Not affiliated with the NHL or any data provider. Data is fetched on this computer when you ask for it.</p>
  <script type="module" src="app.js"></script>
</body>
</html>
